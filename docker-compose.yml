services:
  registry:
    container_name: atelier-registry
    image: registry:2
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  nginx:
    container_name: atelier-nginx
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/includes:/etc/nginx/includes:ro

  blog-blue:
    container_name: atelier-blog-blue
    image: ${BLOG_IMAGE:-atelier-blog:test}
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"

  blog-green:
    container_name: atelier-blog-green
    image: ${BLOG_IMAGE:-atelier-blog:test}
    build:
      context: .
      dockerfile: apps/blog/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  registry-data:
